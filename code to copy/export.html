<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERA Map Prototype</title>

<!-- Copy EVERYTHING from this BEGIN marker through the END marker

  <style>
    /* Squarespace strips <link> tags in Code Blocks; @import works here. */
    @import url("https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Teachers:wght@400;500;600;700&display=swap");

    /* Scope to #viz so Squarespace theme body fonts do not override. */
    #viz {
      --font-size-base: 14px;
      --font-size-lg: 16px;
      --font-size-sm: 13px;
      --font-size-xl: 21px;
      --font-size-title: 24px;
      --font-serif: "Libre Baskerville", "Times New Roman", Times, serif;
      max-width: 975px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      font-family: "Teachers", sans-serif;
      font-size: var(--font-size-base);
      line-height: 1.4;
      background: #fff;
    }

    #viz,
    #viz button,
    #viz select,
    #viz input {
      font-family: "Teachers", sans-serif;
    }

    #filters {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .filter-btn {
      --btn-fill: #ccc;
      --btn-on-fill-text: #222;
      --frame-width: 3px;
      position: relative;
      border: none;
      background: #fff;
      color: #222;
      padding: 7px 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: var(--font-size-lg);
      line-height: 1.3;
      text-align: left;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: color 0.2s ease;
    }

    /* Colored frame on all four sides (supports solid + gradient fills) */
    .filter-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: var(--frame-width);
      background: var(--btn-fill);
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.2s ease;
    }

    /* Fill / bottom bar (supports solid + gradient fills) */
    .filter-btn::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--frame-width);
      background: var(--btn-fill);
      transition: height 0.2s ease;
      pointer-events: none;
      z-index: 0;
    }

    .filter-btn:hover:not(.active)::after {
      height: calc(var(--frame-width) + 4px);
    }

    .filter-btn.active {
      color: var(--btn-on-fill-text);
    }

    .filter-btn.active::before {
      opacity: 0;
    }

    .filter-btn.active::after {
      height: 100%;
    }

    .filter-btn--placeholder {
      background: #ebebeb;
      cursor: default;
      pointer-events: none;
    }

    .filter-btn--placeholder::before,
    .filter-btn--placeholder::after {
      display: none;
    }

    .filter-btn .label {
      position: relative;
      z-index: 1;
      font-weight: 600;
      min-width: 0;
    }

    .filter-btn .count {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75em;
      height: 1.75em;
      border-radius: 50%;
      background: var(--btn-fill);
      color: var(--btn-on-fill-text);
      font-size: var(--font-size-sm);
      font-weight: 600;
      line-height: 1;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .filter-btn.active .count {
      background: #fff;
      color: #000;
    }

    #map-frame {
      position: relative;
      border: 1px solid #000;
      aspect-ratio: 975 / 610;
      overflow: hidden;
    }

    #map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.85);
      font-size: var(--font-size-base);
      z-index: 5;
      pointer-events: none;
    }

    #map-loading.hidden {
      display: none;
    }

    #map svg {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    #map path.state {
      transition: fill 0.3s, opacity 0.25s;
      cursor: pointer;
    }

    .tooltip {
      position: absolute;
      display: none;
      visibility: hidden;
      box-sizing: border-box;
      width: 360px;
      height: 185px;
      border: 2px solid #000;
      background: #fff;
      padding: 10px 14px;
      font-size: var(--font-size-base);
      line-height: 1.4;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      flex-direction: column;
    }

    .tooltip.visible {
      display: flex;
      visibility: visible;
    }

    .tooltip-name {
      font-family: var(--font-serif);
      font-size: var(--font-size-title);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .tooltip-category {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
      font-weight: 700;
    }

    .tooltip-swatch {
      width: 14px;
      height: 14px;
      border: 1px solid #000;
      flex-shrink: 0;
    }

    .tooltip-background {
      font-size: var(--font-size-base);
      line-height: 1.4;
      color: #333;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      max-height: calc(var(--font-size-base) * 1.4 * 3);
      flex: 0 0 auto;
    }

    .tooltip-cta {
      margin-top: auto;
      padding-top: 8px;
      font-weight: 700;
      flex-shrink: 0;
    }

    #state-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 33.333%;
      height: 100%;
      box-sizing: border-box;
      border-left: 2px solid #000;
      background: #fff;
      display: flex;
      flex-direction: column;
      font-size: var(--font-size-base);
      line-height: 1.4;
      z-index: 6;
      transform: translateX(100%);
      transition: transform 750ms cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    #state-panel.visible {
      transform: translateX(0);
      pointer-events: auto;
    }

    .state-panel-header {
      position: relative;
      padding: 14px 40px 14px 14px;
      border-bottom: 1px solid #000;
    }

    .state-panel-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border: 2px solid #000;
      background: #fff;
      font-size: var(--font-size-xl);
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .state-panel-name {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: var(--font-size-title);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .state-panel-category {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .state-panel-swatch {
      width: 14px;
      height: 14px;
      border: 1px solid #000;
      flex-shrink: 0;
    }

    .state-panel-tabs {
      display: flex;
      border-bottom: 1px solid #000;
    }

    .state-panel-tab {
      flex: 1 1 0;
      min-width: 0;
      box-sizing: border-box;
      border: none;
      border-right: 1px solid #000;
      background: #ebebeb;
      padding: 10px 8px;
      font-size: var(--font-size-base);
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .state-panel-tab:last-child {
      border-right: none;
    }

    .state-panel-tab.active {
      background: #fff;
      box-shadow: inset 0 -2px 0 0 #000;
    }

    .state-panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .state-panel-pane {
      display: none;
      font-size: var(--font-size-base);
      color: #333;
      white-space: pre-line;
    }

    .state-panel-pane.active {
      display: block;
    }

    .state-panel-pane em {
      color: #666;
    }

    @media (max-width: 700px) {
      #filters {
        flex-direction: column;
        flex-wrap: nowrap;
      }

      .filter-btn {
        width: 100%;
        min-width: 0;
      }

      #state-panel {
        width: 100%;
        border-left: none;
      }
    }
  </style>

  <div id="viz">
    <div id="filters">
      <button type="button" class="filter-btn filter-btn--placeholder" aria-hidden="true"><span class="label">&nbsp;</span><span class="count">&nbsp;</span></button>
      <button type="button" class="filter-btn filter-btn--placeholder" aria-hidden="true"><span class="label">&nbsp;</span><span class="count">&nbsp;</span></button>
      <button type="button" class="filter-btn filter-btn--placeholder" aria-hidden="true"><span class="label">&nbsp;</span><span class="count">&nbsp;</span></button>
      <button type="button" class="filter-btn filter-btn--placeholder" aria-hidden="true"><span class="label">&nbsp;</span><span class="count">&nbsp;</span></button>
      <button type="button" class="filter-btn filter-btn--placeholder" aria-hidden="true"><span class="label">&nbsp;</span><span class="count">&nbsp;</span></button>
    </div>
    <div id="map-frame">
      <div id="map-loading">Map loading</div>
      <div id="map"></div>
      <div id="state-panel" aria-hidden="true">
        <div class="state-panel-header">
          <button type="button" class="state-panel-close" aria-label="Close">×</button>
          <div class="state-panel-name"></div>
          <div class="state-panel-category">
            <span class="state-panel-swatch"></span>
            <span class="state-panel-status"></span>
          </div>
        </div>
        <div class="state-panel-tabs">
          <button type="button" class="state-panel-tab active" data-tab="review">Federal Standard of Review</button>
          <button type="button" class="state-panel-tab" data-tab="cases">Sex Equality Cases</button>
        </div>
        <div class="state-panel-content">
          <div class="state-panel-pane active" data-pane="review"></div>
          <div class="state-panel-pane" data-pane="cases"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modular D3 (selection, geo, scale, transition) — ~half the weight of full d3@7 -->
  <script src="https://cdn.jsdelivr.net/combine/npm/d3-color@3/dist/d3-color.min.js,npm/d3-dispatch@3/dist/d3-dispatch.min.js,npm/d3-ease@3/dist/d3-ease.min.js,npm/d3-interpolate@3/dist/d3-interpolate.min.js,npm/d3-selection@3/dist/d3-selection.min.js,npm/d3-timer@3/dist/d3-timer.min.js,npm/d3-transition@3/dist/d3-transition.min.js,npm/d3-array@3/dist/d3-array.min.js,npm/d3-format@3/dist/d3-format.min.js,npm/d3-time@3/dist/d3-time.min.js,npm/d3-time-format@4/dist/d3-time-format.min.js,npm/d3-scale@4/dist/d3-scale.min.js,npm/d3-geo@3/dist/d3-geo.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>

  // PUT UPDATED GOOGLE SHEETS DEPLOYMENT LINK HERE
  const SHEET_DATA_URL = "https://script.google.com/macros/s/AKfycbz78SJdxcvR4p7zjgKB8xyB4MF85pifCbUPB0Q_YpyCajKDDK4PVwehDkF64M4HesHbIg/exec";
  

  const TOPO_URL = "https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json";
  const MAP_WIDTH = 975;
  const MAP_HEIGHT = 610;
  const PANEL_WIDTH_RATIO = 1 / 3;
  const MAP_PLACEHOLDER_FILL = "#e8e8e8";
  const ZOOM_DURATION = 750;
  const MOBILE_LAYOUT_MQ = "(max-width: 700px)";

  function isMobileLayout() {
    return window.matchMedia(MOBILE_LAYOUT_MQ).matches;
  }

  function mapTransition(mapLayer) {
    return mapLayer.transition().duration(ZOOM_DURATION).ease(d3.easeCubicInOut);
  }

  const ERA_TYPES = [
    "No State ERA",
    "Ongoing Campaign",
    "Ltd. Gender Equality Provisions",
    "Full State ERA",
    "Expanded ERA"
  ];

  const COLOR_PALETTES = {
    current: ["#c4c4c4", "#ffb239", "#46a0d6", "#2f3a72", "#209f57"],
    option1: ["#F5ECC2", "#B7C2A9", "#D6B43E", "#064F6E", "#C53C69"],
    option2: ["#E4E4E4", "#C19F2C", "#C3CD9D", "#437742", "#0D1C43"],
    option3: ["#A8A8A8", "#FDBF68", "#C16B27", "#A5C8D1", "#064F6E"],
    option4: ["#EEEEEE", "#004F46", "#FFDD00", "#78CDD0", "#004F46"],
    option5: ["#c4c4c4", "#E36A93", "#78CDD0", "#209f57", "rainbow"],

  };

  const RAINBOW_SENTINEL = "rainbow";
  const RAINBOW_GRADIENT_ID = "rainbow-gradient";
  const RAINBOW_STOPS = [
    { offset: "0%", color: "#e05c5c" },
    { offset: "20%", color: "#e89a4e" },
    { offset: "40%", color: "#e6d05a" },
    { offset: "60%", color: "#5fb877" },
    { offset: "80%", color: "#5a8fd6" },
    { offset: "100%", color: "#9a6bc9" }
  ];
  const RAINBOW_CSS_GRADIENT = `linear-gradient(135deg, ${RAINBOW_STOPS.map(s => `${s.color} ${s.offset}`).join(", ")})`;

  const FILTER_BUTTON_ORDER = [...ERA_TYPES].reverse();

  const color = d3.scaleOrdinal()
    .domain(ERA_TYPES)
    .range(COLOR_PALETTES.option5)
    .unknown("#f0f0f0");

  const activeFilters = new Set();
  const mapUI = {
    lookup: null,
    tooltip: null,
    statePaths: null,
    outlineLayer: null,
    path: null,
    activeTab: "review",
    zoomOut: null,
    isZoomed: false
  };

  function fetchSheetJsonp(url) {
    return new Promise((resolve, reject) => {
      const callbackName = `sheetCallback_${Date.now()}`;
      const script = document.createElement("script");

      window[callbackName] = (data) => {
        delete window[callbackName];
        script.remove();
        resolve(data);
      };

      script.src = `${url}${url.includes("?") ? "&" : "?"}callback=${callbackName}`;
      script.onerror = () => {
        delete window[callbackName];
        script.remove();
        reject(new Error("Sheet JSONP fetch failed"));
      };
      document.head.appendChild(script);
    });
  }

  function countByCategory(stateData) {
    const counts = Object.fromEntries(ERA_TYPES.map(t => [t, 0]));
    stateData.forEach(d => {
      const type = d["State ERA type"];
      if (type in counts) counts[type] += 1;
    });
    return counts;
  }

  function textColor(hex) {
    // The rainbow gradient is light overall, so use dark text for non-hex values.
    if (!hex || !hex.startsWith("#")) return "#222";
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? "#222" : "#fff";
  }

  function getEraType(row) {
    return row ? row["State ERA type"] : null;
  }

  function isRainbow(value) {
    return value === RAINBOW_SENTINEL;
  }

  function svgFill(era) {
    const value = color(era);
    return isRainbow(value) ? `url(#${RAINBOW_GRADIENT_ID})` : value;
  }

  function applySwatchBackground(selection, value) {
    if (isRainbow(value)) {
      selection
        .style("background-color", null)
        .style("background-image", RAINBOW_CSS_GRADIENT);
    } else {
      selection
        .style("background-image", null)
        .style("background-color", value);
    }
  }

  function applyFilterButtonColor(selection, value) {
    const fill = isRainbow(value) ? RAINBOW_CSS_GRADIENT : value;
    selection
      .style("--btn-fill", fill)
      .style("--btn-on-fill-text", textColor(value))
      .style("background-color", null)
      .style("background-image", null)
      .style("color", null);
  }

  function swatchStyle(value) {
    return isRainbow(value)
      ? `background-image:${RAINBOW_CSS_GRADIENT}`
      : `background-color:${value}`;
  }

  function renderMap(us) {
    const states = topojson.feature(us, us.objects.states);
    const borders = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
    const path = d3.geoPath();

    const svg = d3.select("#map")
      .append("svg")
      .attr("viewBox", [0, 0, MAP_WIDTH, MAP_HEIGHT]);

    const gradient = svg.append("defs")
      .append("linearGradient")
      .attr("id", RAINBOW_GRADIENT_ID)
      .attr("x1", "0%")
      .attr("y1", "0%")
      .attr("x2", "100%")
      .attr("y2", "100%");

    gradient.selectAll("stop")
      .data(RAINBOW_STOPS)
      .join("stop")
      .attr("offset", d => d.offset)
      .attr("stop-color", d => d.color);

    const mapLayer = svg.append("g").attr("class", "map-layer");

    const statePaths = mapLayer.append("g")
      .selectAll("path")
      .data(states.features)
      .join("path")
      .attr("class", "state")
      .attr("fill", MAP_PLACEHOLDER_FILL)
      .attr("d", path);

    mapLayer.append("path")
      .datum(borders)
      .attr("class", "state-borders")
      .attr("fill", "none")
      .attr("stroke", "#fff")
      .attr("stroke-linejoin", "round")
      .attr("d", path);

    const outlineLayer = mapLayer.append("g").attr("class", "state-outline");
    mapUI.outlineLayer = outlineLayer;
    mapUI.path = path;

    attachZoom(svg, mapLayer, statePaths, path);

    return { statePaths, svg };
  }

  function setStateOutline(feature) {
    if (!mapUI.outlineLayer || !mapUI.path) return;

    mapUI.outlineLayer.selectAll("path")
      .data(feature ? [feature] : [])
      .join("path")
      .attr("fill", "none")
      .attr("stroke", "#000")
      .attr("stroke-width", 1)
      .attr("stroke-linejoin", "round")
      .attr("pointer-events", "none")
      .attr("d", mapUI.path);
  }

  function initStatePanel() {
    const panel = d3.select("#state-panel");

    panel.selectAll(".state-panel-tab")
      .on("click", function () {
        const tab = this.dataset.tab;
        mapUI.activeTab = tab;
        panel.selectAll(".state-panel-tab")
          .classed("active", function () { return this.dataset.tab === tab; });
        panel.selectAll(".state-panel-pane")
          .classed("active", function () { return this.dataset.pane === tab; });
      });

    panel.select(".state-panel-close")
      .on("click", (event) => {
        event.stopPropagation();
        if (mapUI.zoomOut) mapUI.zoomOut();
      });

    panel.on("click", (event) => event.stopPropagation());

    return panel;
  }

  function setPaneContent(selection, text, emptyMessage) {
    selection.selectAll("*").remove();
    if (text) {
      selection.text(text);
    } else {
      selection.append("em").text(emptyMessage);
    }
  }

  let panelClearTimer = null;

  function showStatePanel(row) {
    if (!row) return;

    if (panelClearTimer) {
      clearTimeout(panelClearTimer);
      panelClearTimer = null;
    }

    const panel = d3.select("#state-panel");
    const era = row["State ERA type"];
    const review = (row["Federal Standard of Review"] || "").trim();
    const cases = (row["Sex Equality Cases"] || "").trim();

    panel.select(".state-panel-name").text(row.State);
    panel.select(".state-panel-status").text(era || "Unknown");
    applySwatchBackground(panel.select(".state-panel-swatch"), color(era));

    setPaneContent(
      panel.select('[data-pane="review"]'),
      review,
      "No federal standard of review information available."
    );
    setPaneContent(
      panel.select('[data-pane="cases"]'),
      cases,
      "No sex equality cases available."
    );

    panel.selectAll(".state-panel-tab")
      .classed("active", function () { return this.dataset.tab === mapUI.activeTab; });
    panel.selectAll(".state-panel-pane")
      .classed("active", function () { return this.dataset.pane === mapUI.activeTab; });

    panel.classed("visible", false).attr("aria-hidden", "true");
    requestAnimationFrame(() => {
      panel.classed("visible", true).attr("aria-hidden", null);
    });
  }

  function clearStatePanel() {
    const panel = d3.select("#state-panel");
    panel.select(".state-panel-name").text("");
    panel.select(".state-panel-status").text("");
    panel.select(".state-panel-swatch")
      .style("background-color", null)
      .style("background-image", null);
    panel.select('[data-pane="review"]').selectAll("*").remove();
    panel.select('[data-pane="cases"]').selectAll("*").remove();
  }

  function hideStatePanel() {
    const panelNode = document.getElementById("state-panel");

    // Move focus out before aria-hidden, otherwise browsers block hiding a focused subtree.
    if (panelNode.contains(document.activeElement)) {
      document.activeElement.blur();
    }

    d3.select("#state-panel").classed("visible", false).attr("aria-hidden", "true");

    // Keep the content in place until the slide-out transition finishes.
    if (panelClearTimer) clearTimeout(panelClearTimer);
    panelClearTimer = setTimeout(() => {
      panelClearTimer = null;
      clearStatePanel();
    }, ZOOM_DURATION);
  }

  function applyMapColors(statePaths, lookup) {
    statePaths.attr("fill", d => svgFill(getEraType(lookup.get(d.properties.name))));
  }

  function updateMapOpacity(statePaths, lookup) {
    const filtering = activeFilters.size > 0;
    statePaths.attr("opacity", d => {
      const era = getEraType(lookup.get(d.properties.name));
      if (!filtering) return 1;
      return era && activeFilters.has(era) ? 1 : 0.15;
    });
  }

  function renderFilters(counts, statePaths, lookup) {
    const filters = d3.select("#filters")
      .selectAll("button")
      .data(FILTER_BUTTON_ORDER)
      .join("button")
      .attr("class", "filter-btn")
      .attr("type", "button")
      .attr("aria-hidden", null)
      .each(function (d) {
        applyFilterButtonColor(d3.select(this), color(d));
      })
      .classed("active", d => activeFilters.has(d))
      .classed("filter-btn--placeholder", false)
      .on("click", (_, category) => {
        if (activeFilters.has(category)) {
          activeFilters.delete(category);
        } else {
          activeFilters.add(category);
        }
        filters.classed("active", d => activeFilters.has(d));
        updateMapOpacity(statePaths, lookup);
      });

    filters.html(d => `
      <span class="label">${d}</span>
      <span class="count">${counts[d]}</span>
    `);
  }

  function createTooltip() {
    return d3.select("#map-frame")
      .append("div")
      .attr("class", "tooltip");
  }

  function showTooltip(tooltip, event, row) {
    if (!row || mapUI.isZoomed || d3.select("#state-panel").classed("visible")) {
      hideTooltip(tooltip);
      return;
    }

    const era = row["State ERA type"];
    const hover = (row.HOVER || "").trim();

    tooltip.html(`
      <div class="tooltip-name">${row.State}</div>
      <div class="tooltip-category">
        <span class="tooltip-swatch" style="${swatchStyle(color(era))}"></span>
        <span>${era || "Unknown"}</span>
      </div>
      ${hover
        ? `<div class="tooltip-background">${hover}</div>`
        : `<div class="tooltip-background"><em>No information available.</em></div>`}
      <div class="tooltip-cta">Click to learn more</div>
    `);

    tooltip.classed("visible", true).style("visibility", "hidden");

    const mapFrame = document.getElementById("map-frame");
    const [x, y] = d3.pointer(event, mapFrame);
    const offset = 12;
    const tipNode = tooltip.node();
    const tipWidth = tipNode.offsetWidth;
    const tipHeight = tipNode.offsetHeight;
    const maxX = mapFrame.clientWidth - tipWidth - 4;
    const maxY = mapFrame.clientHeight - tipHeight - 4;

    tooltip
      .style("left", `${Math.min(x + offset, maxX)}px`)
      .style("top", `${Math.min(y + offset, maxY)}px`)
      .style("visibility", "visible");
  }

  function hideTooltip(tooltip) {
    tooltip
      .classed("visible", false)
      .style("visibility", null)
      .style("left", null)
      .style("top", null)
      .html("");
  }

  function zoomToState(mapLayer, path, feature, panelOpen) {
    const [[x0, y0], [x1, y1]] = path.bounds(feature);
    const dx = x1 - x0;
    const dy = y1 - y0;
    const x = (x0 + x1) / 2;
    const y = (y0 + y1) / 2;
    const viewWidth = panelOpen ? MAP_WIDTH * (1 - PANEL_WIDTH_RATIO) : MAP_WIDTH;
    const scale = Math.min(8, 0.9 / Math.max(dx / viewWidth, dy / MAP_HEIGHT));
    const translate = [viewWidth / 2 - scale * x, MAP_HEIGHT / 2 - scale * y];

    mapTransition(mapLayer)
      .attr("transform", `translate(${translate}) scale(${scale})`);
  }

  function resetZoom(mapLayer, onEnd) {
    const transition = mapTransition(mapLayer)
      .attr("transform", "translate(0, 0) scale(1)");
    if (onEnd) transition.on("end", onEnd);
  }

  function attachZoom(svg, mapLayer, statePaths, path) {
    let zoomedState = null;

    function zoomOut() {
      zoomedState = null;
      setStateOutline(null);
      hideStatePanel();
      if (mapUI.tooltip) hideTooltip(mapUI.tooltip);
      resetZoom(mapLayer, () => {
        mapUI.isZoomed = false;
      });
    }

    function zoomIn(d) {
      zoomedState = d;
      mapUI.isZoomed = true;
      const row = mapUI.lookup ? mapUI.lookup.get(d.properties.name) : null;
      if (mapUI.tooltip) hideTooltip(mapUI.tooltip);
      setStateOutline(d);
      showStatePanel(row);
      if (!isMobileLayout()) {
        zoomToState(mapLayer, path, d, true);
      }
    }

    statePaths.on("click", (event, d) => {
      event.stopPropagation();
      if (zoomedState) {
        zoomOut();
        return;
      }
      zoomIn(d);
    });

    svg.on("click", () => {
      if (zoomedState) zoomOut();
    });

    mapUI.zoomOut = zoomOut;
  }

  function attachTooltip(statePaths, lookup, tooltip) {
    statePaths
      .on("click.zoom", () => hideTooltip(tooltip))
      .on("mouseenter", (event, d) => {
        if (!mapUI.isZoomed) setStateOutline(d);
        showTooltip(tooltip, event, lookup.get(d.properties.name));
      })
      .on("mousemove", (event, d) => {
        showTooltip(tooltip, event, lookup.get(d.properties.name));
      })
      .on("mouseleave", () => {
        if (!mapUI.isZoomed) setStateOutline(null);
        hideTooltip(tooltip);
      });

    d3.select("#map").on("mouseleave", () => {
      if (!mapUI.isZoomed) setStateOutline(null);
      hideTooltip(tooltip);
    });
  }

  function hideMapLoading() {
    d3.select("#map-loading").classed("hidden", true);
  }

  function applySheetData(sheetData, statePaths, tooltip) {
    console.log("Sheet data:", sheetData);

    const stateData = sheetData["State ERAs"];
    const lookup = new Map(stateData.map(d => [d.State, d]));
    const counts = countByCategory(stateData);

    mapUI.lookup = lookup;
    mapUI.tooltip = tooltip;

    applyMapColors(statePaths, lookup);
    renderFilters(counts, statePaths, lookup);
    attachTooltip(statePaths, lookup, tooltip);
    hideMapLoading();
  }

  initStatePanel();

  // Start sheet fetch immediately so it overlaps topology download + map render.
  const sheetPromise = fetchSheetJsonp(SHEET_DATA_URL);

  fetch(TOPO_URL)
    .then(res => {
      if (!res.ok) throw new Error(`Map topology HTTP ${res.status}`);
      return res.json();
    })
    .then(us => {
      const { statePaths } = renderMap(us);
      mapUI.statePaths = statePaths;
      const tooltip = createTooltip();
      mapUI.tooltip = tooltip;

      return sheetPromise
        .then(stateData => applySheetData(stateData, statePaths, tooltip))
        .catch(err => {
          console.error("Failed to load sheet data:", err);
          hideMapLoading();
        });
    })
    .catch(err => console.error("Failed to load map:", err));
  </script>
